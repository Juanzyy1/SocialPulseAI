# Blueprint de Render: UN solo servicio que sirve la API y el frontend compilado (mismo origen).
# La base de datos NO se crea aquí: créala en el panel de Render y pega su dirección interna
# en DATABASE_URL, así eliges tú el plan (el gratuito caduca a los 30 días).
services:
  - type: web
    name: socialpulse-ai
    runtime: node
    plan: free
    region: oregon   # la base de datos debe crearse en la MISMA región (no se puede cambiar después)
    # Compila el frontend y después el backend. --include=dev porque con NODE_ENV=production npm omitiría
    # las herramientas de compilación.
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev && npx prisma generate && npm run build
    # Aplica las migraciones pendientes y arranca.
    startCommand: cd backend && npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_DIST_DIR
        value: ../frontend/dist
      # Provisional: se mide con GET /api/v1/diagnostics/network y se corrige (tarea 9.4).
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: EXPOSE_NETWORK_DIAGNOSTICS
        value: "false"
      # Si Render te asigna otra dirección (por ejemplo, con un sufijo), corrígela en el panel.
      - key: FRONTEND_URL
        value: https://socialpulse-ai-xweo.onrender.com
      # Secretos: Render los pide en el panel; no están en el repositorio.
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
       # Google en producción (9.5): las tres juntas o ninguna.
      - key: GOOGLE_REDIRECT_URI
        value: https://socialpulse-ai-xweo.onrender.com/api/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Instagram Login (Fase 8.1).
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CONFIG_ID
        value: "1248684200916395"
      - key: INSTAGRAM_REDIRECT_URI
        value: https://socialpulse-ai-xweo.onrender.com/api/v1/integrations/instagram/callback
      # TikTok Login Kit (Fase 8.2); agregar client key y secret desde el panel de Render.
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: https://socialpulse-ai-xweo.onrender.com/api/v1/integrations/tiktok/callback